
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Manager Cloud</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:'Segoe UI'; background:#0f172a; color:white; }
.container { max-width:1100px; margin:auto; padding:15px; }

h2 { text-align:center; }

.form-row {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

input, select {
    padding:10px;
    border-radius:8px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    flex:1;
}

button {
    padding:10px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}

/* Month Navigation styling */
.month-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    padding: 10px 20px;
    border-radius: 10px;
    margin-top: 15px;
}
.month-nav button {
    background: #3b82f6;
}

/* Category Filter Chips styling */
.filter-container {
    margin-top: 20px;
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
}
.filter-title {
    font-size: 0.9rem;
    color: #94a3b8;
    margin-bottom: 8px;
}
.filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.filter-chip {
    background: #334155;
    border: 1px solid #475569;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
}
.filter-chip.active {
    background: #3b82f6;
    border-color: #60a5fa;
}

.summary {
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.card {
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.main-grid {
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-top:20px;
}

table { width:100%; border-collapse:collapse; }

th, td {
    padding:10px;
    border-bottom:1px solid #334155;
    text-align:center;
}

td button { background:#ef4444; }

.chart-box {
    background:#1e293b;
    padding:15px;
    border-radius:10px;
}

@media(max-width:768px){
    .summary { grid-template-columns:1fr; }
    .main-grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="container">

<h2>☁️ Money Manager</h2>

<div class="form-row">
<input type="text" id="newCategory" placeholder="Add Category">
<button onclick="addCategory()">Add Category</button>
</div>

<div class="form-row">
<input type="date" id="date">
<input type="text" id="desc" placeholder="Description">
<input type="number" id="amount" placeholder="Amount">

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<select id="category"></select>

<button onclick="addTransaction()">Add</button>
</div>

<div class="month-nav">
<button onclick="changeMonth(-1)">◀ Previous Month</button>
<h3 id="currentMonthDisplay"></h3>
<button onclick="changeMonth(1)">Next Month ▶</button>
</div>

<div class="filter-container">
<div class="filter-title">Filter Analysis by Category:</div>
<div id="categoryFilters" class="filter-chips"></div>
</div>

<div class="summary">
<div class="card">Income ₹<span id="income">0</span></div>
<div class="card">Expense ₹<span id="expense">0</span></div>
<div class="card">Balance ₹<span id="balance">0</span></div>
</div>

<div class="main-grid">

<div>
<table>
<thead>
<tr>
<th>Date</th>
<th>Time</th>
<th>Type</th>
<th>Description</th>
<th>Category</th>
<th>Amount</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<div class="chart-box">
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBCVoY823nRlgk3aKS5TuOfjr-QCiH3x_k",
  authDomain: "moneymanager-abcff.firebaseapp.com",
  projectId: "moneymanager-abcff",
  storageBucket: "moneymanager-abcff.firebasestorage.app",
  messagingSenderId: "1011399670430",
  appId: "1:1011399670430:web:07dc6b5e6d9368abd8998f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let data = [];
let categories = [];
let chart;

// Track the selected year and month for recording/viewing (Month is 0-indexed: 0 = Jan, 11 = Dec)
let currentNavDate = new Date();
let selectedCategoryFilter = "All";

// DEFAULT DATE
document.getElementById("date").value = new Date().toISOString().split('T')[0];

// Update month display
function updateMonthDisplay() {
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById("currentMonthDisplay").innerText = `${months[currentNavDate.getMonth()]} ${currentNavDate.getFullYear()}`;
}

// Navigating between months
window.changeMonth = function(direction) {
    currentNavDate.setMonth(currentNavDate.getMonth() + direction);
    updateMonthDisplay();
    render(); // Re-render to sort data according to the newly viewed month
}

// Set up the interactive category analysis buttons
function renderCategoryFilters() {
    let container = document.getElementById("categoryFilters");
    let html = `<button class="filter-chip ${selectedCategoryFilter === 'All' ? 'active' : ''}" onclick="filterByCategory('All')">All Categories</button>`;
    
    categories.forEach(c => {
        html += `<button class="filter-chip ${selectedCategoryFilter === c ? 'active' : ''}" onclick="filterByCategory('${c}')">${c}</button>`;
    });
    
    container.innerHTML = html;
}

// Set global category filter value
window.filterByCategory = function(category) {
    selectedCategoryFilter = category;
    renderCategoryFilters();
    render();
}

// LOAD CATEGORY DROPDOWN
function loadCategories(){
    let select = document.getElementById("category");
    select.innerHTML="";
    categories.forEach(c=>{
        select.innerHTML += `<option>${c}</option>`;
    });
}

// ADD CATEGORY
window.addCategory = async function(){
    let val = document.getElementById("newCategory").value.trim();

    if(!val) return alert("Enter category");

    await setDoc(doc(db, "categories", val), { name: val });

    document.getElementById("newCategory").value="";
}

// LISTEN CATEGORY
onSnapshot(collection(db,"categories"), async snapshot=>{
    categories = [];

    snapshot.forEach(doc=>{
        categories.push(doc.data().name);
    });

    // AUTO CREATE DEFAULT
    if(categories.length === 0){
        await setDoc(doc(db, "categories", "Food"), { name: "Food" });
        await setDoc(doc(db, "categories", "Travel"), { name: "Travel" });
        await setDoc(doc(db, "categories", "Bills"), { name: "Bills" });
        return;
    }

    loadCategories();
    renderCategoryFilters();
});

// ADD TRANSACTION
window.addTransaction = async function(){
    if(!desc.value || !amount.value) return alert("Fill all fields");

    await addDoc(collection(db, "transactions"), {
        date: date.value,
        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        desc: desc.value,
        amount: Number(amount.value),
        type: type.value,
        category: category.value,
        timestamp: Date.now()
    });

    desc.value="";
    amount.value="";
}

// DELETE
window.deleteItem = async function(id){
    await deleteDoc(doc(db, "transactions", id));
}

// LIVE DATA
const q = query(collection(db,"transactions"), orderBy("timestamp","desc"));

onSnapshot(q, snapshot=>{
    data = [];
    snapshot.forEach(docSnap=>{
        data.push({ id: docSnap.id, ...docSnap.data() });
    });
    updateMonthDisplay();
    render();
});

// RENDER
function render(){
    let html="";
    let income=0, expense=0;
    
    // Get currently viewed Target Year and Month strings
    let targetYear = currentNavDate.getFullYear();
    let targetMonth = currentNavDate.getMonth(); // 0 - 11

    // 1. Filter original data array by selected Month/Year AND Category Filter
    let filteredData = data.filter(e => {
        if (!e.date) return false;
        let itemDate = new Date(e.date);
        
        // Month match check
        let matchesMonth = (itemDate.getFullYear() === targetYear && itemDate.getMonth() === targetMonth);
        // Category selection check
        let matchesCategory = (selectedCategoryFilter === "All" || e.category === selectedCategoryFilter);
        
        return matchesMonth && matchesCategory;
    });

    // 2. Loop over dynamic results to construct summary tallies and structural rows
    filteredData.forEach(e=>{
        if(e.type==="income") income+=e.amount;
        else expense+=e.amount;

        html += `
        <tr>
        <td>${e.date}</td>
        <td>${e.time}</td>
        <td>${e.type}</td>
        <td>${e.desc}</td>
        <td>${e.category}</td>
        <td>${e.amount}</td>
        <td><button onclick="deleteItem('${e.id}')">X</button></td>
        </tr>`;
    });

    document.getElementById("list").innerHTML = html;
    document.getElementById("income").innerText = income;
    document.getElementById("expense").innerText = expense;
    document.getElementById("balance").innerText = income - expense;

    // Send the correctly filtered sub-list down to chart component logic
    drawChart(filteredData);
}

// CHART
function drawChart(filteredList){
    let ctx=document.getElementById("chart");

    if(chart) chart.destroy();

    let cat={};

    filteredList.forEach(e=>{
        if(e.type==="expense"){
            cat[e.category]=(cat[e.category]||0)+e.amount;
        }
    });

    // Handle edge case where no data items exist under current applied category filters 
    if(Object.keys(cat).length === 0) {
        cat["No Expense Data Found"] = 0;
    }

    chart = new Chart(ctx,{
        type:'doughnut',
        data:{
            labels:Object.keys(cat),
            datasets:[{data:Object.values(cat)}]
        },
        options:{
            plugins:{ legend:{ position:'bottom' } }
        }
    });
}
</script>

</body>
</html>
